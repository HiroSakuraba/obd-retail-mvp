; Glovebox dongle firmware -- PlatformIO project (ESP32-C3, ESP-IDF).
;
; Builds firmware/esp32/src for real hardware. The host test suite
; (firmware/esp32/tests, `make check`) validates the same sources against
; simulator/can_ecu_sim.py without hardware.
;
; Not compiled in this sandbox (no ESP-IDF toolchain here); validated for
; structure. On a machine with PlatformIO: `pio run` from this directory.

[env:glovebox-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = espidf
monitor_speed = 115200
build_flags =
    -D CONFIG_OBD_TWAI_TX_PIN=21
    -D CONFIG_OBD_TWAI_RX_PIN=22
; Rev A PCB (ESP32-C3-MINI-1) remaps the RX pin -- override per board:
;   -D CONFIG_OBD_TWAI_RX_PIN=<pin>
